name: Validate plugins

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

      - name: Validate each plugin
        run: |
          status=0
          for d in plugins/*/; do
            echo "::group::$d"
            claude plugin validate "$d" --strict || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Check skill structure
        run: python3 scripts/check-skills.py

      # software-factory has plain Node tests (Node 22, set up above, is needed
      # for glob patterns in `node --test`); they create git commits in temp repos.
      - name: software-factory tests
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          node --test "plugins/software-factory/test/**/*.test.mjs" "plugins/software-factory/control-center/test/**/*.test.mjs"

      # `claude plugin validate` only checks manifest shape. It passes on a
      # marketplace whose plugins cannot actually be resolved and installed,
      # so the only trustworthy check is performing a real install.
      - name: Install smoke test
        run: |
          set -euo pipefail
          claude plugin marketplace add "$PWD"
          status=0
          for d in plugins/*/; do
            name=$(basename "$d")
            echo "::group::install $name"
            if claude plugin install "$name@personal-plugins"; then
              claude plugin list | grep -q "$name" \
                || { echo "::error::$name installed but is not listed"; status=1; }
            else
              echo "::error::$name failed to install from the marketplace"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
