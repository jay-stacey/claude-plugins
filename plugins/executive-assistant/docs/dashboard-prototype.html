<title>Day Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Left rail for views, a working column in the middle, the assistant chat docked right.
   One look, dark by choice: slate ink with an amber "now" hand, like the hand on a clock face. */
:root {
  color-scheme: dark;
  --bg: #0d1015;
  --bg-2: #11151b;
  --panel: #151a21;
  --panel-2: #1b2029;
  --raise: #222833;
  --line: #262d38;
  --line-2: #333c4a;
  --fg: #e8ebf0;
  --muted: #9aa3b2;
  --faint: #677284;
  --accent: #f2b84b;      /* now, timers, the one thing */
  --accent-ink: #1d1606;
  --focus: #5ab4c6;       /* focus blocks */
  --meet: #929ef5;        /* meetings */
  --personal: #6f7c90;    /* gym, lunch */
  --ok: #5ccb8f;
  --warn: #ff9d5c;
  --bad: #ef7070;
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --font-body: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
  --r-sm: 7px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); font-weight: 600; }

/* shell */
.app { display: grid; grid-template-columns: 196px minmax(0, 1fr) auto; height: 100%; }
.rail { background: var(--bg-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-block: 18px; padding-inline: 12px; gap: 4px; }
.brand { font-family: var(--font-display); font-size: 18px; font-weight: 650; padding: 4px 10px 18px; display: flex; align-items: center; gap: 9px; }
.brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.nav-btn { display: flex; align-items: center; gap: 10px; background: none; border: 0; border-radius: var(--r-sm); padding: 9px 10px; color: var(--muted); text-align: left; font-weight: 500; }
.nav-btn svg { width: 18px; height: 18px; flex: none; }
.nav-btn:hover { background: var(--panel); color: var(--fg); }
.nav-btn[aria-current="page"] { background: var(--panel-2); color: var(--fg); }
.nav-count { margin-left: auto; font-size: 11px; color: var(--faint); }
.rail-foot { margin-top: auto; display: grid; gap: 8px; padding-inline: 4px; }
.why-toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; padding: 6px; }
.why-toggle input { accent-color: var(--accent); }

.main { overflow: auto; padding-block: 18px 40px; padding-inline: 24px; min-width: 0; }
.chat { width: 372px; border-left: 1px solid var(--line); background: var(--bg-2); display: flex; flex-direction: column; min-height: 0; }
.chat[hidden] { display: none !important; }

/* top bar */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; margin-bottom: 18px; }
.date h1 { font-size: 24px; }
.date .sub { color: var(--muted); font-size: 13px; }
.dayline { flex: 1 1 320px; min-width: 0; }
.dayline-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.dayline-meta strong { color: var(--fg); font-weight: 600; }
.daybar { position: relative; height: 10px; border-radius: 6px; background: var(--panel-2); overflow: hidden; }
.daybar .seg { position: absolute; top: 0; bottom: 0; }
.daybar .seg.meet { background: color-mix(in srgb, var(--meet) 55%, transparent); }
.daybar .seg.focus { background: color-mix(in srgb, var(--focus) 45%, transparent); }
.daybar .past { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0,0,0,0.45); }
.daybar .nowmark { position: absolute; top: -2px; bottom: -2px; width: 3px; background: var(--accent); border-radius: 2px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 999px; padding: 5px 11px; font-size: 12px; color: var(--muted); background: var(--panel); white-space: nowrap; }
.chip strong { color: var(--fg); font-weight: 600; }
.chip.amber { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent); }
.btn { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: var(--r-sm); padding: 7px 12px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn.ok { color: var(--ok); }

/* design notes */
.why { display: none; font-size: 11px; line-height: 1.3; color: var(--accent); border: 1px dashed color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 6px; padding: 4px 7px; margin-top: 8px; background: color-mix(in srgb, var(--accent) 7%, transparent); }
body.why-on .why { display: block; }

/* panels */
.grid-today { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.col { display: grid; gap: 18px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-head h2 { font-size: 15px; }
.panel-head .meta { font-size: 12px; color: var(--faint); }

/* now card */
.now { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 9%, var(--panel-2)), var(--panel-2) 55%); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius: 14px; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; }
.now-pill { display: inline-flex; align-items: center; gap: 7px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 11px; letter-spacing: 0.1em; border-radius: 999px; padding: 3px 10px; }
.now h2 { font-size: 26px; line-height: 1.15; margin: 12px 0 6px; }
.now .why-line { color: var(--muted); font-size: 13px; }
.step { margin-top: 16px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--bg-2); border: 1px solid var(--line); }
.step .label { color: var(--accent); }
.step p { margin: 4px 0 0; font-size: 15px; }
.now-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.ring-wrap { display: grid; justify-items: center; gap: 10px; align-content: start; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .t { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .t b { font-family: var(--font-mono); font-size: 26px; font-weight: 500; display: block; }
.ring .t span { font-size: 11px; color: var(--faint); }
.seg-btns { display: flex; gap: 6px; }

/* lists */
.tlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.trow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 8px; border-radius: var(--r-sm); }
.trow:hover { background: var(--panel-2); }
.trow .title { min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
.trow .title small { display: block; color: var(--faint); font-size: 12px; }
.check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line-2); background: transparent; display: grid; place-items: center; padding: 0; }
.check:hover { border-color: var(--ok); }
.check.on { background: var(--ok); border-color: var(--ok); }
.check.on::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #0d1015; border-bottom: 2px solid #0d1015; transform: rotate(-45deg) translate(1px, -1px); }
.prio { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }
.prio.high { background: var(--bad); } .prio.med { background: var(--warn); } .prio.low { background: var(--faint); }
.meta-r { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--faint); white-space: nowrap; }
.tag { font-size: 11px; color: var(--muted); background: var(--raise); border-radius: 5px; padding: 1px 6px; }
.done-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; padding: 6px 8px; font-size: 13px; color: var(--muted); }
.done-row .mono { color: var(--faint); font-size: 12px; }
.pts { color: var(--ok); font-size: 12px; font-weight: 600; }
.empty { color: var(--faint); font-size: 13px; padding: 8px; }
.resume { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px dashed var(--line-2); border-radius: var(--r); padding: 12px 14px; background: var(--bg-2); }
.resume p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

/* timeline */
.next-meet { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--meet) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--meet) 30%, var(--line)); margin-bottom: 12px; font-size: 13px; }
.next-meet b { font-family: var(--font-mono); color: var(--meet); font-weight: 500; }
.tl-scroll { max-height: 470px; overflow: auto; border-radius: var(--r-sm); }
.tl { position: relative; margin-left: 46px; }
.tl .hour { position: absolute; left: -46px; right: 0; border-top: 1px solid var(--line); }
.tl .hour span { position: absolute; top: -8px; left: 0; font-family: var(--font-mono); font-size: 11px; color: var(--faint); background: var(--panel); padding-right: 6px; }
.ev { position: absolute; left: 6px; right: 4px; border-radius: 7px; padding: 5px 9px; font-size: 12.5px; overflow: hidden; border: 1px solid transparent; }
.ev b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.ev.meet { background: color-mix(in srgb, var(--meet) 16%, var(--panel)); border-color: color-mix(in srgb, var(--meet) 35%, transparent); }
.ev.focus { background: color-mix(in srgb, var(--focus) 14%, var(--panel)); border-color: color-mix(in srgb, var(--focus) 35%, transparent); }
.ev.personal { background: var(--panel-2); border-color: var(--line); color: var(--muted); }
.ev.past { opacity: 0.45; }
.ev .flag { display: inline-block; margin-left: 6px; font-size: 10px; color: var(--warn); font-family: var(--font-body); font-weight: 600; letter-spacing: 0.04em; }
.tl .nowline { position: absolute; left: -8px; right: 0; height: 2px; background: var(--accent); z-index: 3; }
.tl .nowline::before { content: ""; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

.fu { display: grid; gap: 8px; }
.fu-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: var(--r-sm); background: var(--bg-2); border: 1px solid var(--line); font-size: 13px; }
.fu-item small { display: block; color: var(--faint); font-size: 12px; }
.ext { display: grid; gap: 6px; }
.ext a { color: var(--fg); text-decoration: none; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 7px 8px; border-radius: var(--r-sm); font-size: 13px; }
.ext a:hover { background: var(--panel-2); }
.ext .src { font-size: 11px; color: var(--faint); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding-top: 2px; }

/* tasks board */
.quickadd { display: grid; gap: 8px; margin-bottom: 16px; }
.qa-row { display: flex; gap: 8px; }
.qa-row input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 10px 12px; }
.qa-row input::placeholder { color: var(--faint); }
.qa-preview { display: flex; gap: 6px; flex-wrap: wrap; min-height: 24px; font-size: 12px; color: var(--faint); align-items: center; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
.colm { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; min-height: 120px; }
.colm.drop { border-color: var(--accent); }
.colm-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.colm-head h3 { font-size: 14px; }
.cap { font-size: 12px; color: var(--faint); }
.cap.full { color: var(--warn); }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 11px; margin-bottom: 8px; cursor: grab; }
.card:hover { border-color: var(--line-2); }
.card.is-now { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.card .t { font-weight: 500; overflow-wrap: anywhere; }
.card .m { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--faint); align-items: center; }
.fold { width: 100%; text-align: left; background: var(--bg-2); border: 1px dashed var(--line-2); border-radius: var(--r-sm); padding: 10px; color: var(--muted); font-size: 13px; }

/* week */
.week-sum { font-size: 15px; line-height: 1.6; max-width: 72ch; margin: 0 0 16px; color: var(--muted); }
.week-sum strong { color: var(--fg); font-weight: 600; }
.week { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
.day { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.day.today { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.day h3 { font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; }
.day h3 small { font-family: var(--font-body); font-size: 12px; color: var(--faint); font-weight: 500; }
.load { margin: 8px 0 10px; }
.load-bar { height: 6px; border-radius: 4px; background: var(--panel-2); overflow: hidden; display: flex; }
.load-bar i { display: block; height: 100%; }
.load small { font-size: 11px; color: var(--faint); }
.train { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 5px; background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); margin-bottom: 8px; }
.wk-ev { font-size: 12.5px; padding: 5px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 6px; }
.wk-ev .mono { color: var(--faint); font-size: 11px; padding-top: 1px; }
.wk-flag { font-size: 12px; margin-top: 8px; padding: 7px 8px; border-radius: 6px; background: var(--bg-2); border: 1px solid var(--line); }
.wk-flag.warn { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.wk-flag b { color: var(--warn); font-weight: 600; }
.wk-due { font-size: 12px; margin-top: 6px; color: var(--muted); }
.wk-due::before { content: "Due "; color: var(--bad); font-weight: 600; }

/* notes */
.notes { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; height: calc(100vh - 120px); min-height: 460px; }
.notes-list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; overflow: auto; min-width: 0; }
.notes-list input { width: 100%; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 8px 10px; margin-bottom: 8px; }
.n-item { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: var(--r-sm); padding: 8px 10px; }
.n-item:hover { background: var(--panel-2); }
.n-item[aria-current="true"] { background: var(--panel-2); }
.n-item b { display: block; font-weight: 500; font-size: 13.5px; overflow-wrap: anywhere; }
.n-item small { color: var(--faint); font-size: 11.5px; }
.editor { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.ed-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.ed-bar .path { font-family: var(--font-mono); font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }
.save-state { font-size: 12px; color: var(--ok); }
.ed-body { flex: 1; overflow: auto; padding: 18px 22px; min-height: 0; }
.ed-body textarea { width: 100%; height: 100%; min-height: 360px; resize: none; background: transparent; border: 0; outline: none; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.65; color: var(--fg); }
.md { max-width: 72ch; font-size: 15px; line-height: 1.65; }
.md h1 { font-size: 24px; margin: 0 0 12px; }
.md h2 { font-size: 17px; margin: 20px 0 8px; }
.md p { margin: 0 0 10px; }
.md ul { margin: 0 0 12px; padding-left: 20px; }
.md li.task { list-style: none; margin-left: -20px; display: flex; gap: 8px; align-items: baseline; }
.md li.task input { accent-color: var(--ok); }
.md .wl { color: var(--accent); border-bottom: 1px dashed color-mix(in srgb, var(--accent) 50%, transparent); cursor: pointer; }
.md a { color: var(--focus); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 11px; font-size: 12px; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--fg); }

/* chat */
.chat-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.chat-head h2 { font-size: 15px; }
.chat-head p { margin: 2px 0 0; font-size: 12px; color: var(--faint); }
.chat-log { flex: 1; overflow: auto; padding: 14px 16px; display: grid; gap: 12px; align-content: start; min-height: 0; }
.msg { max-width: 100%; font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; }
.msg.me { justify-self: end; background: var(--raise); padding: 9px 12px; border-radius: 12px 12px 4px 12px; max-width: 86%; }
.msg.bot p { margin: 0 0 6px; }
.tool-line { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 7px; font-family: var(--font-mono); }
.tool-line .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--focus); }
.tool-line.run .dot { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.msg-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chat-sugg { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 10px; }
.chat-sugg button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 5px 10px; font-size: 12px; color: var(--muted); }
.chat-sugg button:hover { color: var(--fg); }
.composer { padding: 12px 16px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.composer textarea { width: 100%; resize: none; height: 64px; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 9px 11px; }
.composer-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.composer-row small { color: var(--faint); font-size: 11.5px; }

/* drawer + modal + overlay */
.scrim { position: fixed; inset: 0; background: rgba(4,6,9,0.6); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--bg-2); border-left: 1px solid var(--line-2); z-index: 41; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.drawer-body { flex: 1; overflow: auto; padding: 16px 18px; display: grid; gap: 14px; align-content: start; }
.field { display: grid; gap: 5px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
.field input, .field select, .field textarea { background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 8px 10px; width: 100%; }
.field textarea { min-height: 110px; resize: vertical; font-family: var(--font-mono); font-size: 13px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.drawer-foot { display: flex; gap: 8px; justify-content: space-between; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }

            ${hours.map(h => `<div class="hour" style="top:${y(h * 60)}px"><span>${pad(h)}:00</span></div>`).join("")}
            ${events.map(e => `<div class="ev ${e.kind} ${t(e.e) <= m ? "past" : ""}" style="top:${y(t(e.s))}px;height:${Math.max(18, (t(e.e) - t(e.s)) / 60 * PX - 3).toFixed(1)}px"><b>${esc(e.title)}${e.flag ? `<span class="flag">${e.flag}</span>` : ""}</b><span>${e.s} to ${e.e}</span></div>`).join("")}
            <div class="nowline" style="top:${y(m)}px"></div>
          </div></div>
          <div class="why">Your own events only. Focus blocks are typed by kind of work, not one per ticket. The "Move" request in chat shifts blocks instead of rebuilding the day.</div>
        </section>

        <section class="panel">
          <div class="panel-head"><h2>Promises to keep</h2><span class="meta">from meetings and sent mail</span></div>
          <div class="fu">${followups.map((f, i) => `<div class="fu-item"><div>${esc(f.text)}<small>${esc(f.why)}</small></div><button class="btn small" data-fu="${i}">Make a task</button></div>`).join("") || `<div class="empty">Nothing waiting.</div>`}</div>

        </section>

        <section class="panel">
          <div class="panel-head"><h2>Needs you elsewhere</h2><span class="meta">links out, not tasks</span></div>
          <div class="ext">${external.map(x => `<a href="#" onclick="return false"><span class="src">${esc(x.src)}</span><span>${esc(x.text)}</span></a>`).join("")}</div>
          <div class="why">Linear stays the system of record, so tickets are shown as links, never copied into tasks. Items you already replied to are left out.</div>
        </section>
      </div>
    </div>`;
    wireRows();
    if (n) {
      $("#focusBtn").onclick = () => openFocus();
      $("#nowDone").onclick = () => complete(n.id);
      $("#breakBtn").onclick = () => breakDown(n);
      $("#parkBtn").onclick = () => park(n);
      document.querySelectorAll("[data-len]").forEach(b => b.onclick = () => setTimer(+b.dataset.len));
    }
    document.querySelectorAll("[data-resume]").forEach(b => b.onclick = () => resume(+b.dataset.resume));
    document.querySelectorAll("[data-fu]").forEach(b => b.onclick = () => {
      const f = followups.splice(+b.dataset.fu, 1)[0];
      tasks.push({ id: nextId++, title: f.text, list: "today", priority: "med", est: 10, due: "2026-10-13", first: "Open the thread.", tags: ["follow-up"], src: "Follow-up", notes: "" });
      toast("Task added", `"${f.text}" is on Today.`); render();
    });
    const sc = $("#tlScroll"); if (sc) sc.scrollTop = Math.max(0, +y(m) - 140);
  }
  function row(x) {
    return `<li class="trow"><button class="check" data-done="${x.id}" aria-label="Mark done"></button>
      <div class="title" data-edit="${x.id}"><span class="prio ${x.priority}"></span>${esc(x.title)}${x.src ? `<small>${esc(x.src)}</small>` : ""}</div>
      <div class="meta-r"><span class="mono">${x.est}m</span>${x.due === "2026-10-13" ? `<span class="tag">today</span>` : ""}<button class="btn small ghost" data-mknow="${x.id}">Make Now</button></div></li>`;
  }
  function wireRows() {
    document.querySelectorAll("[data-done]").forEach(b => b.onclick = e => { e.stopPropagation(); b.classList.add("on"); setTimeout(() => complete(+b.dataset.done), 220); });
    document.querySelectorAll("[data-edit]").forEach(el => el.onclick = () => openDrawer(+el.dataset.edit));
    document.querySelectorAll("[data-mknow]").forEach(b => b.onclick = () => makeNow(+b.dataset.mknow));
  }

  // ---------- actions ----------
  function complete(id) {
    const x = byId(id); if (!x) return;
    const wasNow = x.list === "now";
    const d = now();
    x.list = "done"; x.doneAt = hm(d.getHours() * 60 + d.getMinutes()); x.pts = ptsFor(x.priority);
    S.points += x.pts; S.today += x.pts;
    stopTimer(); S.timer.left = S.timer.total;
    if (wasNow) {
      const nx = inList("today")[0];
      if (nx) { nx.list = "now"; toast(`+${x.pts} points`, `Done. Next up: ${nx.title}.`); }
      else toast(`+${x.pts} points`, "Done. Today's list is clear.");
    } else toast(`+${x.pts} points`, `Done: ${x.title}.`);
    render();
  }
  function makeNow(id) {
    const cur = nowTask(); if (cur) cur.list = "today";
    byId(id).list = "now"; stopTimer(); S.timer.left = S.timer.total; render();
  }
  function breakDown(n) {
    const list = smaller[n.id] || [`Open what you need for "${n.title}". Do nothing else.`, "Write one sentence about what done looks like.", "Do the first two minutes, then decide."];
    const i = (n._bd || 0) % list.length; n._bd = i + 1; n.first = list[i];
    toast("Smaller step", n.first);
    render();
  }
  function park(n) {
    if (parked.length >= 3) { toast("Parking full", "Three tasks are parked. Resume one before you park another."); return; }
    parked.unshift({ title: n.title, at: hm(Math.floor(nowMin())), next: n.first, taskId: n.id });
    n.list = "today"; stopTimer(); S.timer.left = S.timer.total;
    const nx = inList("today").find(x => x.id !== n.id); if (nx) nx.list = "now";
    toast("Parked", `Saved your place in "${n.title}".`); render();
  }
  function resume(i) {
    const p = parked.splice(i, 1)[0];
    const cur = nowTask(); if (cur) cur.list = "today";
    let x = p.taskId ? byId(p.taskId) : null;
    if (!x) { x = { id: nextId++, title: p.title, list: "now", priority: "med", est: 30, due: null, first: p.next, tags: [], src: "Parked", notes: "" }; tasks.push(x); }
    x.list = "now"; x.first = p.next; render();
  }

  // ---------- timer + focus mode ----------
  function setTimer(min) { stopTimer(); S.timer.total = S.timer.left = min * 60; render(); }
  function stopTimer() { clearInterval(S.timer.id); S.timer.id = null; S.timer.running = false; }
  function startTimer() {
    if (S.timer.running) return;
    S.timer.running = true;
    S.timer.id = setInterval(() => {
      S.timer.left = Math.max(0, S.timer.left - 1);
      document.querySelectorAll(".ring").forEach(r => { r.outerHTML = ring(r.closest(".focus-in") ? 220 : 0); });
      if (S.timer.left === 0) { stopTimer(); checkIn(); }
    }, 1000);
  }
  function openFocus() {
    const n = nowTask(); if (!n) return;
    $("#layer").innerHTML = `<div class="focus-ov" role="dialog" aria-label="Focus session"><div class="focus-in">
      <span class="now-pill">FOCUS · ${Math.round(S.timer.total / 60)} MIN</span>
      <h2>${esc(n.title)}</h2>
      ${ring(220)}
      <div class="step"><div class="label">First step</div><p>${esc(n.first)}</p></div>
      <div class="now-actions" style="justify-content:center">
        <button class="btn" id="fPause">Pause</button><button class="btn ok" id="fDone">Done</button><button class="btn" id="fStuck">I'm stuck</button><button class="btn ghost" id="fExit">Leave focus</button>
      </div>
      <button class="btn small ghost" id="fSkip">Skip to the check-in (demo)</button>
      <div class="why" style="display:${document.body.classList.contains("why-on") ? "block" : "none"}">Body doubling. Everything else is hidden. When the timer ends, the assistant checks in the way a person sitting next to you would.</div>
    </div></div>`;
    startTimer();
    $("#fPause").onclick = e => { if (S.timer.running) { stopTimer(); e.target.textContent = "Resume"; } else { startTimer(); e.target.textContent = "Pause"; } };
    $("#fDone").onclick = () => { closeLayer(); complete(n.id); };
    $("#fStuck").onclick = () => { breakDown(n); openFocus(); };
    $("#fExit").onclick = () => { closeLayer(); render(); };
    $("#fSkip").onclick = () => { stopTimer(); S.timer.left = 0; checkIn(); };
  }
  function checkIn() {
    const n = nowTask();
    $("#layer").innerHTML = `<div class="scrim"></div><div class="modal" role="dialog" aria-label="Check-in">
      <div class="label">Check-in</div><h2>Time is up. How did it go?</h2>
      <p class="lead">${esc(n ? n.title : "Your focus session")}</p>
      <div class="now-actions">
        <button class="btn primary" id="ciDone">Done, +${n ? ptsFor(n.priority) : 1} and 2 for the session</button>
        <button class="btn" id="ciMore">15 more minutes</button>
        <button class="btn" id="ciStuck">I'm stuck</button>
      </div></div>`;
    $("#ciDone").onclick = () => { S.points += 2; S.today += 2; closeLayer(); if (n) complete(n.id); };
    $("#ciMore").onclick = () => { S.timer.total = S.timer.left = 15 * 60; closeLayer(); openFocus(); };
    $("#ciStuck").onclick = () => { closeLayer(); if (n) breakDown(n); S.timer.left = S.timer.total; render(); };
  }
  function closeLayer() { $("#layer").innerHTML = ""; }

  // ---------- quick add parser ----------
  const DAYS = { mon: "2026-10-19", tue: "2026-10-20", wed: "2026-10-14", thu: "2026-10-15", fri: "2026-10-16", today: "2026-10-13", tomorrow: "2026-10-14", tmr: "2026-10-14" };
  const DLABEL = { "2026-10-13": "today", "2026-10-14": "Wed", "2026-10-15": "Thu", "2026-10-16": "Fri", "2026-10-19": "next Mon", "2026-10-20": "next Tue" };
  function parse(text) {
    const out = { title: [], priority: "med", est: 30, due: null, tags: [], hasP: false, hasE: false };
    text.trim().split(/\s+/).filter(Boolean).forEach(w => {
      const lw = w.toLowerCase();
      let m;
      if ((m = lw.match(/^!(high|med|low|h|m|l)$/))) { out.priority = { h: "high", m: "med", l: "low" }[m[1][0]]; out.hasP = true; }
      else if ((m = lw.match(/^(\d+)(m|min|h|hr)$/))) { out.est = m[2].startsWith("h") ? +m[1] * 60 : +m[1]; out.hasE = true; }
      else if (DAYS[lw]) out.due = DAYS[lw];
      else if (/^(monday|tues?|tuesday|weds?|wednesday|thur?s?|thursday|friday)$/.test(lw)) out.due = DAYS[lw.slice(0, 3)];
      else if (lw.startsWith("#") && lw.length > 1) out.tags.push(lw.slice(1));
      else out.title.push(w);
    });
    out.title = out.title.join(" ");
    const todayCount = inList("today").length + (nowTask() ? 1 : 0);
    out.list = out.due === "2026-10-13" ? (todayCount >= 5 ? "week" : "today") : out.due && out.due <= "2026-10-16" ? "week" : out.due ? "later" : "week";
    out.full = out.due === "2026-10-13" && todayCount >= 5;
    return out;
  }
  const LISTNAME = { now: "Now", today: "Today", week: "This week", later: "Later", done: "Done" };

  // ---------- tasks board ----------
  let showLater = false;
  function renderTasks() {
    const cols = [["today", "Today"], ["week", "This week"], ["later", "Later"], ["done", "Done"]];
    const todayN = inList("today").length + (nowTask() ? 1 : 0);
    $("#view").innerHTML = `
      <div class="quickadd">
        <div class="qa-row"><input id="qa" aria-label="Quick add" placeholder="Add a task. Try: call the bank fri 15m !high #admin"><button class="btn primary" id="qaBtn">Add</button></div>
        <div class="qa-preview" id="qaPrev">Words like fri, tomorrow, 15m, !high and #tag are read for you.</div>
        <div class="why">Upkeep is a chore, so capture is one line. Most tasks arrive by themselves from email, meetings and chat.</div>
      </div>
      <div class="board">${cols.map(([k, label]) => {
        let items = k === "today" ? [nowTask(), ...inList("today")].filter(Boolean) : inList(k);
        const cap = k === "today" ? `<span class="cap ${todayN >= 5 ? "full" : ""}">${todayN} of 5</span>` : k === "later" ? `<span class="cap">${items.length + laterHidden}</span>` : `<span class="cap">${items.length}</span>`;
        let body;
        if (k === "later" && !showLater) body = `<button class="fold" id="unfold">${items.length + laterHidden} tasks folded away. Show them.</button><div class="why">Later stays folded so a long list cannot pull your attention.</div>`;
        else body = items.map(card).join("") || `<div class="empty">Empty</div>`;
        return `<div class="colm" data-col="${k}"><div class="colm-head"><h3>${label}</h3>${cap}</div>${body}</div>`;
      }).join("")}</div>`;
    const qa = $("#qa");
    qa.oninput = () => {
      const p = parse(qa.value);
      $("#qaPrev").innerHTML = qa.value.trim() ? [
        `<span class="tag">${esc(p.title || "untitled")}</span>`,
        `<span class="tag">${LISTNAME[p.list]}</span>`,
        p.due ? `<span class="tag">due ${DLABEL[p.due]}</span>` : "",
        `<span class="tag">${p.est}m${p.hasE ? "" : " (guess)"}</span>`,
        `<span class="tag"><span class="prio ${p.priority}"></span>${p.priority}</span>`,
        ...p.tags.map(x => `<span class="tag">#${esc(x)}</span>`),
        p.full ? `<span style="color:var(--warn)">Today is full, so this goes to This week.</span>` : ""].join("") : "Words like fri, tomorrow, 15m, !high and #tag are read for you.";
    };
    const add = () => {
      if (!qa.value.trim()) return;
      const p = parse(qa.value);
      tasks.push({ id: nextId++, title: p.title || "Untitled task", list: p.list, priority: p.priority, est: p.est, due: p.due, first: "", tags: p.tags, src: "Quick add", notes: "" });
      toast("Task added", `${p.title || "Untitled task"}, in ${LISTNAME[p.list]}.`);
      render(); $("#qa")?.focus();
    };
    $("#qaBtn").onclick = add;
    qa.onkeydown = e => { if (e.key === "Enter") add(); };
    $("#unfold") && ($("#unfold").onclick = () => { showLater = true; renderTasks(); });
    document.querySelectorAll(".card").forEach(c => {
      c.onclick = () => openDrawer(+c.dataset.id);
      c.ondragstart = e => { e.dataTransfer.setData("text/plain", c.dataset.id); };
    });
    document.querySelectorAll(".colm").forEach(col => {
      col.ondragover = e => { e.preventDefault(); col.classList.add("drop"); };
      col.ondragleave = () => col.classList.remove("drop");
      col.ondrop = e => { e.preventDefault(); col.classList.remove("drop"); moveTo(+e.dataTransfer.getData("text/plain"), col.dataset.col); };
    });
  }
  function card(x) {
    return `<div class="card ${x.list === "now" ? "is-now" : ""}" draggable="true" data-id="${x.id}">
      <div class="t"><span class="prio ${x.priority}"></span>${esc(x.title)}</div>
      <div class="m">${x.list === "now" ? `<span class="tag" style="color:var(--accent)">Now</span>` : ""}<span class="mono">${x.est}m</span>${x.due ? `<span>due ${DLABEL[x.due] || x.due}</span>` : ""}${x.doneAt ? `<span class="mono">${x.doneAt}</span>` : ""}${(x.tags || []).map(g => `<span class="tag">#${esc(g)}</span>`).join("")}</div></div>`;
  }
  function moveTo(id, list) {
    const x = byId(id); if (!x) return;
    if (list === "done") { complete(id); return; }
    if (list === "today" && x.list !== "today" && x.list !== "now" && inList("today").length + (nowTask() ? 1 : 0) >= 5) { toast("Today is full", "Five is the limit. Move something out first."); return; }
    x.list = list; render();
  }

  // ---------- drawer ----------
  function openDrawer(id) {
    const x = byId(id); if (!x) return;
    $("#layer").innerHTML = `<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-label="Edit task">
      <div class="drawer-head"><h2 style="font-size:16px">Edit task</h2><button class="icon-btn" id="dClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="drawer-body">
        <div class="field"><label for="fTitle">Title</label><input id="fTitle" value="${esc(x.title)}"></div>
        <div class="field"><label for="fFirst">First step (something you can do in 5 minutes)</label><input id="fFirst" value="${esc(x.first)}"></div>
        <div class="field-row">
          <div class="field"><label for="fList">List</label><select id="fList">${["now", "today", "week", "later", "done"].map(l => `<option value="${l}" ${x.list === l ? "selected" : ""}>${LISTNAME[l]}</option>`).join("")}</select></div>
          <div class="field"><label for="fPrio">Priority</label><select id="fPrio">${["high", "med", "low"].map(p => `<option ${x.priority === p ? "selected" : ""}>${p}</option>`).join("")}</select></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="fDue">Due</label><input id="fDue" type="date" value="${x.due || ""}"></div>
          <div class="field"><label for="fEst">Estimate, minutes</label><input id="fEst" type="number" min="5" step="5" value="${x.est}"></div>
        </div>
        <div class="field"><label for="fTags">Tags</label><input id="fTags" value="${esc((x.tags || []).join(", "))}"></div>
        <div class="field"><label for="fNotes">Notes (markdown)</label><textarea id="fNotes">${esc(x.notes)}</textarea></div>
        <div class="field"><label>Stored as</label><div class="mono" style="font-size:12px;color:var(--faint);overflow-wrap:anywhere">tasks/t-${String(x.id).padStart(4, "0")}.md${x.src ? ` · source: ${esc(x.src)}` : ""}</div></div>
        <div class="why">Each task is one markdown file with YAML at the top. You can open it in any editor, and the assistant reads the same file.</div>
      </div>
      <div class="drawer-foot"><button class="btn" id="dDrop">Drop task</button><div style="display:flex;gap:8px"><button class="btn ok" id="dDone">Mark done</button><button class="btn primary" id="dSave">Save</button></div></div>
    </aside>`;
    const close = () => closeLayer();
    $("#scrim").onclick = close; $("#dClose").onclick = close;
    $("#dSave").onclick = () => {
      const newList = $("#fList").value;
      if (newList === "now" && x.list !== "now") { const cur = nowTask(); if (cur) cur.list = "today"; }
      Object.assign(x, { title: $("#fTitle").value.trim() || x.title, first: $("#fFirst").value, priority: $("#fPrio").value, due: $("#fDue").value || null, est: Math.max(5, +$("#fEst").value || x.est), tags: $("#fTags").value.split(",").map(s => s.trim()).filter(Boolean), notes: $("#fNotes").value });
      close();
      if (newList === "done") complete(x.id); else { x.list = newList; toast("Saved", "Task file updated."); render(); }
    };
    $("#dDone").onclick = () => { close(); complete(x.id); };
    $("#dDrop").onclick = () => { x.list = "dropped"; close(); toast("Dropped", `"${x.title}" moved to dropped. It is still on disk.`); render(); };
    $("#fTitle").focus();
  }

  // ---------- week ----------
  function renderWeek() {
    $("#view").innerHTML = `
      <p class="week-sum"><strong>Wednesday is the heavy day:</strong> go/no-go plus three other meetings, and one focus hour left. <strong>Release notes are due Thursday</strong> and are not started, so they are booked for this afternoon. The strategy review today needs prep, and a task for it is on Today.</p>
      <div class="why" style="margin:-6px 0 14px">The morning brief writes this summary every day for the next five workdays, so the week is never a surprise. On Mondays it goes deeper.</div>
      <div class="week">${week.map(d => {
        const work = 8.5, mp = d.meet / work * 100, fp = d.focus / work * 100;
        return `<div class="day ${d.today ? "today" : ""}">
          <h3>${d.d}${d.today ? "<small>today</small>" : ""}</h3>
          <div class="load"><div class="load-bar"><i style="width:${mp}%;background:var(--meet)"></i><i style="width:${fp}%;background:var(--focus)"></i></div><small>${d.meet}h meetings · ${d.focus}h focus</small></div>
          ${d.train ? `<span class="train">${esc(d.train)}</span>` : ""}
          ${d.evs.map(([tm, n]) => `<div class="wk-ev"><span class="mono">${tm}</span><span>${esc(n)}</span></div>`).join("")}
          ${d.due.map(x => `<div class="wk-due">${esc(x)}</div>`).join("")}
          ${d.flags.map(([k, a, b]) => `<div class="wk-flag ${k}"><b>${esc(a)}</b> ${esc(b)}</div>`).join("")}
        </div>`;
      }).join("")}</div>`;
  }

  // ---------- notes ----------
  function md(src) {
    const inline = s => esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[\[(.+?)\]\]/g, '<span class="wl" data-wl="$1">$1</span>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    let html = "", inList = false;
    src.split("\n").forEach((line, i) => {
      let m;
      const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
      if ((m = line.match(/^(#{1,2})\s+(.*)/))) { closeList(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
      else if ((m = line.match(/^- \[( |x)\] (.*)/i))) { if (!inList) { html += "<ul>"; inList = true; } html += `<li class="task"><input type="checkbox" data-line="${i}" ${m[1].toLowerCase() === "x" ? "checked" : ""} aria-label="Task"><span>${inline(m[2])}</span></li>`; }
      else if ((m = line.match(/^- (.*)/))) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(m[1])}</li>`; }
      else if (line.trim() === "") closeList();
      else { closeList(); html += `<p>${inline(line)}</p>`; }
    });
    if (inList) html += "</ul>";
    return html;
  }
  let saveTimer = null;
  function renderNotes(filter = "") {
    const n = notes.find(x => x.id === S.activeNote);
    const list = notes.filter(x => (x.title + x.body + x.path).toLowerCase().includes(filter.toLowerCase()));
    $("#view").innerHTML = `<div class="notes">
      <div class="notes-list"><input id="nSearch" placeholder="Search notes" value="${esc(filter)}" aria-label="Search notes">
        <button class="btn small" id="nNew" style="width:100%;margin-bottom:8px">New note</button>
        ${list.map(x => `<button class="n-item" data-note="${x.id}" aria-current="${x.id === S.activeNote}"><b>${esc(x.title)}</b><small class="mono">${esc(x.path)} · ${esc(x.updated)}</small></button>`).join("") || `<div class="empty">No match.</div>`}
      </div>
      <div class="editor">
        <div class="ed-bar"><span class="path">${esc(n.path)}</span>
          <div style="display:flex;gap:10px;align-items:center"><span class="save-state" id="saveState">Saved to disk</span>
          <div class="seg"><button data-mode="preview" aria-pressed="${S.noteMode === "preview"}">Read</button><button data-mode="edit" aria-pressed="${S.noteMode === "edit"}">Edit</button></div></div>
        </div>
        <div class="ed-body">${S.noteMode === "edit" ? `<textarea id="nText" aria-label="Note text">${esc(n.body)}</textarea>` : `<div class="md">${md(n.body)}</div>`}</div>
        <div class="why" style="margin:0 14px 14px">In the build, this is the same live-preview editor as Notes Desk. It writes straight to the file and refuses to save if the file changed on disk since you opened it.</div>
      </div></div>`;
    const s = $("#nSearch");
    s.oninput = () => { renderNotes(s.value); const ns = $("#nSearch"); ns.focus(); ns.setSelectionRange(ns.value.length, ns.value.length); };
    document.querySelectorAll("[data-note]").forEach(b => b.onclick = () => { S.activeNote = b.dataset.note; renderNotes(filter); });
    document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { S.noteMode = b.dataset.mode; renderNotes(filter); });
    document.querySelectorAll("[data-wl]").forEach(w => w.onclick = () => { const tgt = notes.find(x => x.title === w.dataset.wl); if (tgt) { S.activeNote = tgt.id; renderNotes(); } });
    document.querySelectorAll(".md input[type=checkbox]").forEach(cb => cb.onchange = () => {
      const lines = n.body.split("\n"); const i = +cb.dataset.line;
      lines[i] = lines[i].replace(/^- \[( |x)\]/i, cb.checked ? "- [x]" : "- [ ]"); n.body = lines.join("\n"); flashSave();
    });
    const ta = $("#nText"); if (ta) { ta.oninput = () => { n.body = ta.value; const h = n.body.match(/^#\s+(.*)/m); if (h && n.id !== "n1") n.title = h[1]; flashSave(); }; ta.focus(); }
    $("#nNew").onclick = () => { const id = "n" + nextId++; notes.unshift({ id, path: "inbox/untitled.md", title: "Untitled", updated: "now", body: "# Untitled\n\n" }); S.activeNote = id; S.noteMode = "edit"; renderNotes(); };
  }
  function flashSave() {
    const st = $("#saveState"); if (!st) return;
    st.textContent = "Saving..."; st.style.color = "var(--muted)";
    clearTimeout(saveTimer); saveTimer = setTimeout(() => { st.textContent = "Saved to disk"; st.style.color = "var(--ok)"; }, 700);
  }

  // ---------- chat ----------
  const log = [];
  const suggestions = ["What should I do next?", "Move the release notes to after the strategy review", "Add: call the bank fri 15m !high", "How did the inbox go this morning?"];
  function renderChat() {
    $("#chatLog").innerHTML = log.map(m => m.me ? `<div class="msg me">${esc(m.text)}</div>` :
      `<div class="msg bot">${(m.tools || []).map(x => `<div class="tool-line ${x.run ? "run" : ""}"><span class="dot"></span>${esc(x.t)}</div>`).join("")}${m.html || ""}${m.actions ? `<div class="msg-actions">${m.actions.map((a, i) => `<button class="btn small" data-act="${log.indexOf(m)}-${i}">${esc(a.label)}</button>`).join("")}</div>` : ""}</div>`).join("");
    $("#chatSugg").innerHTML = suggestions.map(s => `<button>${esc(s)}</button>`).join("");
    document.querySelectorAll("#chatSugg button").forEach(b => b.onclick = () => send(b.textContent));
    document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => { const [mi, ai] = b.dataset.act.split("-").map(Number); log[mi].actions[ai].fn(); });
    const l = $("#chatLog"); l.scrollTop = l.scrollHeight;
  }
  function reply(text) {
    const q = text.toLowerCase();
    const n = nowTask();
    if (/move|after|later|push|resched/.test(q)) {
      return { tools: ["Reading today's calendar", "Checking the task store", "Updating the 13:30 focus block"], html: `<p>Moved. <strong>Draft release notes for 3.42</strong> now sits in 13:30 to 14:15, right after the strategy review. Admin and follow-ups shrink to 14:15 to 14:30.</p><p>Thursday's deadline still has a day of slack.</p>`,
        actions: [{ label: "Undo", fn: () => { events[6].title = "[Focus] Admin and follow-ups"; toast("Undone", "The 13:30 block is back."); render(); } }, { label: "Show Today", fn: () => go("today") }],
        effect: () => { events[6].title = "[Focus] Release notes 3.42, then admin"; render(); } };
    }
    if (/^add|remind|task/.test(q)) {
      const p = parse(text.replace(/^(add|remind me to|task)[:\s]*/i, ""));
      return { tools: ["Writing a task file"], html: `<p>Added <strong>${esc(p.title || "a new task")}</strong> to ${LISTNAME[p.list]}${p.due ? `, due ${DLABEL[p.due]}` : ""}, ${p.est} minutes, ${p.priority} priority.</p>`,
        actions: [{ label: "Open tasks", fn: () => go("tasks") }],
        effect: () => { tasks.push({ id: nextId++, title: p.title || "New task", list: p.list, priority: p.priority, est: p.est, due: p.due, first: "", tags: p.tags, src: "Chat", notes: "" }); render(); } };
    }
    if (/inbox|email|mail/.test(q)) {
      return { tools: ["Reading this morning's brief", "Reading email-rules.md"], html: `<p>200 of 200 unread were processed at 06:04. Your rules trashed 142, archived 39 and labeled 3 feed-error logs. Three are left in the inbox, and all three need you.</p><p>One new pattern is waiting: webinar invites from a vendor domain, 6 this week. Make it a trash rule?</p>`,
        actions: [{ label: "Make it a rule", fn: () => toast("Rule added", "Vendor webinar invites: trash, auto. Line 31 of email-rules.md.") }, { label: "Keep showing them", fn: () => toast("OK", "They will keep coming to you for a yes.") }] };
    }
    const m = nowMin();
    const nm = events.filter(e => e.kind === "meet" && t(e.s) > m)[0];
    const gap = nm ? Math.floor(t(nm.s) - m) : 60;
    return { tools: ["Reading your Now task", "Reading today's calendar"], html: n ? `<p>Your Now task is <strong>${esc(n.title)}</strong>. First step: ${esc(n.first)}</p><p>${nm ? `You have ${gap} minutes before ${esc(nm.title)}. A ${gap > 12 ? 10 : 5}-minute timer fits. Park it when the heads-up comes.` : "No meetings left. A 25-minute timer fits."}</p>` : `<p>No Now task. The top of Up next is the right pick.</p>`,
      actions: n ? [{ label: `Start ${gap > 12 ? 10 : 5} min`, fn: () => { setTimer(gap > 12 ? 10 : 5); openFocus(); } }] : [] };
  }
  function send(text) {
    text = text.trim(); if (!text) return;
    log.push({ me: true, text });
    const r = reply(text);
    const bot = { tools: [], html: "" };
    log.push(bot); renderChat();
    let i = 0;
    const step = () => {
      if (i > 0) bot.tools[i - 1].run = false;
      if (i < r.tools.length) { bot.tools.push({ t: r.tools[i], run: true }); i++; renderChat(); setTimeout(step, 520); }
      else { bot.html = r.html; bot.actions = r.actions; r.effect?.(); renderChat(); }
    };
    setTimeout(step, 250);
  }
  log.push({ tools: [{ t: "Morning brief finished at 06:04" }], html: `<p>Morning. Three things matter today: the CSV export PR review, prep for the 12:30 strategy review, and release notes before Thursday.</p><p>Inbox is down to three, all real. Ask me anything, or tell me to move something.</p>` });
  $("#composer").onsubmit = e => { e.preventDefault(); const v = $("#chatInput").value; $("#chatInput").value = ""; send(v); };
  $("#chatInput").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); } };
  function toggleChat() { const c = $("#chat"); c.hidden = !c.hidden; if (!c.hidden) { renderChat(); $("#chatInput").focus(); } }
  $("#chatClose").onclick = toggleChat;
  $("#chatNav").onclick = toggleChat;

  // ---------- shutdown ----------
  const SD = { step: 0, checks: {}, triage: {}, dump: "", first: "Open the 3.42 release notes draft and finish the customer section.", tonight: "no", tonightTask: 103, tonightEnd: "20:30" };
  function openShutdown() { SD.step = 0; drawShutdown(); }
  function drawShutdown() {
    const planned = [nowTask(), ...inList("today"), ...inList("done")].filter(Boolean);
    const open = [nowTask(), ...inList("today")].filter(x => x && x.priority === "high" && !SD.checks[x.id]);
    const proven = { 92: "PR merged at 08:55", 91: "12 Linear issues triaged", 90: "Brief ran at 06:04" };
    const steps = [
      { h: "What got done today?", lead: "Items with proof are already ticked. Tick anything else you finished.",
        body: planned.map(x => { const p = x.list === "done"; return `<div class="sd-row"><button class="check ${p || SD.checks[x.id] ? "on" : ""}" data-sdc="${x.id}" ${p ? "disabled" : ""} aria-label="Done"></button><div>${esc(x.title)}${p ? `<small>Finished ${esc(x.doneAt)}</small>` : ""}</div>${proven[x.id] ? `<span class="proof">${esc(proven[x.id])}</span>` : `<span></span>`}</div>`; }).join("") },
      { h: "High priority, still open", lead: "Each one needs a choice: finish it before you stop, or give it a new day.",
        body: open.length ? open.map(x => { const real = Math.round(x.est * S.speed / 5) * 5; const c = SD.triage[x.id] || ""; return `<div class="sd-row" style="grid-template-columns:minmax(0,1fr)"><div>${esc(x.title)}<small>${x.due === "2026-10-13" ? "Due today. " : ""}About ${real}m at your usual speed.</small></div><div class="choice"><button data-tr="${x.id}:finish" aria-pressed="${c === "finish"}">Finish today</button>${["Wed", "Thu", "Fri", "Next week"].map(d => `<button data-tr="${x.id}:${d}" aria-pressed="${c === d}">Move to ${d}</button>`).join("")}</div></div>`; }).join("") : `<div class="empty">Nothing high priority is open. Nice.</div>` },
      { h: "Empty your head", lead: "Type anything still rattling around. Each line becomes a task in This week.",
        body: `<textarea id="sdDump" placeholder="One thing per line">${esc(SD.dump)}</textarea>` },
      { h: "Tomorrow's first step", lead: "One concrete action. The morning brief opens with it.",
        body: `<input type="text" id="sdFirst" value="${esc(SD.first)}" aria-label="Tomorrow's first step">` },
      { h: "Working tonight?", lead: "Night work is fine when you choose it. Pick one task and an end time, and you get a stop toast.",
        body: `<div class="choice" style="margin-bottom:12px"><button data-tn="no" aria-pressed="${SD.tonight === "no"}">No, the day is done</button><button data-tn="yes" aria-pressed="${SD.tonight === "yes"}">Yes, one thing</button></div>
          ${SD.tonight === "yes" ? `<div class="field-row"><div class="field"><label for="sdTask">Task</label><select id="sdTask">${[...inList("today"), ...inList("week")].map(x => `<option value="${x.id}" ${SD.tonightTask === x.id ? "selected" : ""}>${esc(x.title)}</option>`).join("")}</select></div><div class="field"><label for="sdEnd">Stop at</label><input id="sdEnd" type="time" value="${SD.tonightEnd}"></div></div>` : ""}` }
    ];
    if (SD.step >= steps.length) {
      const doneN = inList("done").length;
      $("#layer").innerHTML = `<div class="scrim"></div><div class="modal" role="dialog" aria-label="Day closed">
        <div class="label">Shutdown complete</div><h2>Day closed.</h2>
        <p class="lead">${doneN} tasks done, ${S.today} points today. Streak is now ${S.streak} days. ${SD.tonight === "yes" ? `Tonight: one task, stop toast at ${esc(SD.tonightEnd)}.` : "Nothing planned for tonight."}</p>
        <p class="lead">Tomorrow starts with: ${esc(SD.first)}</p>
        <div class="why" style="display:${document.body.classList.contains("why-on") ? "block" : "none"}">The shutdown writes to the daily note, saves tomorrow's first step for the brief, and offers a sweep of stale Claude sessions.</div>
        <div class="modal-foot"><span></span><button class="btn primary" id="sdClose">Close</button></div></div>`;
      $("#sdClose").onclick = () => { closeLayer(); render(); };
      return;
    }
    const s = steps[SD.step];
    $("#layer").innerHTML = `<div class="scrim" id="scrim"></div><div class="modal" role="dialog" aria-label="Shutdown">
      <div class="label">Shutdown · step ${SD.step + 1} of ${steps.length}</div>
      <div class="steps">${steps.map((_, i) => `<i class="${i <= SD.step ? "on" : ""}"></i>`).join("")}</div>
      <h2>${s.h}</h2><p class="lead">${s.lead}</p>${s.body}
      <div class="modal-foot"><button class="btn ghost" id="sdBack">${SD.step ? "Back" : "Cancel"}</button><button class="btn primary" id="sdNext">${SD.step === steps.length - 1 ? "Close the day" : "Next"}</button></div></div>`;
    document.querySelectorAll("[data-sdc]").forEach(b => b.onclick = () => { const id = +b.dataset.sdc; SD.checks[id] = !SD.checks[id]; drawShutdown(); });
    document.querySelectorAll("[data-tr]").forEach(b => b.onclick = () => { const [id, c] = b.dataset.tr.split(":"); SD.triage[id] = c; drawShutdown(); });
    document.querySelectorAll("[data-tn]").forEach(b => b.onclick = () => { SD.tonight = b.dataset.tn; drawShutdown(); });
    const keep = () => {
      if ($("#sdDump")) SD.dump = $("#sdDump").value;
      if ($("#sdFirst")) SD.first = $("#sdFirst").value;
      if ($("#sdTask")) SD.tonightTask = +$("#sdTask").value;
      if ($("#sdEnd")) SD.tonightEnd = $("#sdEnd").value;
    };
    $("#sdBack").onclick = () => { keep(); if (SD.step) { SD.step--; drawShutdown(); } else closeLayer(); };
    $("#sdNext").onclick = () => {
      keep();
      if (SD.step === 0) Object.keys(SD.checks).filter(k => SD.checks[k]).forEach(k => { const x = byId(+k); if (x && x.list !== "done") { const d = now(); x.list = "done"; x.doneAt = hm(d.getHours() * 60 + d.getMinutes()); x.pts = ptsFor(x.priority); S.points += x.pts; S.today += x.pts; } });
      if (SD.step === 1) Object.entries(SD.triage).forEach(([id, c]) => { const x = byId(+id); if (x && c !== "finish") { x.list = c === "Next week" ? "later" : "week"; x.due = { Wed: "2026-10-14", Thu: "2026-10-15", Fri: "2026-10-16" }[c] || x.due; } });
      if (SD.step === 2) SD.dump.split("\n").map(l => l.trim()).filter(Boolean).forEach(l => { const p = parse(l); tasks.push({ id: nextId++, title: p.title || l, list: "week", priority: p.priority, est: p.est, due: p.due, first: "", tags: p.tags, src: "Brain dump", notes: "" }); });
      if (SD.step === 4) { S.points += 3; S.today += 3; S.streak += 1; }
      SD.step++; drawShutdown();
    };
    $("#scrim").onclick = () => { keep(); closeLayer(); };
  }

  // ---------- routing ----------
  function go(v) { S.view = v; document.querySelectorAll(".nav-btn[data-view]").forEach(b => b.setAttribute("aria-current", b.dataset.view === v ? "page" : "false")); render(); $("#main").scrollTop = 0; }
  document.querySelectorAll(".nav-btn[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
  function render() {
    renderTop();
    if (S.view === "today") renderToday(); else if (S.view === "tasks") renderTasks(); else if (S.view === "week") renderWeek(); else renderNotes();
  }
  $("#whyToggle").onchange = e => document.body.classList.toggle("why-on", e.target.checked);
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea, select")) return;
    if (e.key === "Escape") closeLayer();
    if (e.key === "/") { e.preventDefault(); if ($("#chat").hidden) toggleChat(); else $("#chatInput").focus(); }
    if (e.key === "n") { e.preventDefault(); go("tasks"); setTimeout(() => $("#qa")?.focus(), 0); }
  });

  if (!isDesktop()) $("#chat").hidden = true;
  render(); renderChat();
  setInterval(() => { if (S.view === "today" && !$("#layer").innerHTML && !document.activeElement.closest?.(".main input, .main textarea")) { const sc = $("#tlScroll")?.scrollTop; render(); if (sc != null && $("#tlScroll")) $("#tlScroll").scrollTop = sc; } else renderTop(); }, 30000);
  setTimeout(() => toast("Heads-up", "Support queue review starts in 10 minutes.", { label: "Got it" }), 4000);
})();
</script>
